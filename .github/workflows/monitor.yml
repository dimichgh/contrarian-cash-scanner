name: Breakout monitor

on:
  schedule:
    # Two runs each weekday, on New York time: a preview about 30 minutes before the close (today's
    # live prices, nothing recorded) and the official run about 2 hours after it (final prices, the
    # closing auction included). GitHub's cron is UTC only, so each run is listed for daylight (EDT)
    # and standard (EST) time; the "Pick the run" step keeps the copy that lands in its window.
    # GitHub can start scheduled runs some minutes late, hence 3:22pm for a ~3:30pm preview.
    - cron: "22 19 * * 1-5"  # preview, 3:22pm EDT
    - cron: "22 20 * * 1-5"  # preview, 3:22pm EST
    - cron: "4 22 * * 1-5"   # after the close, 6:04pm EDT
    - cron: "4 23 * * 1-5"   # after the close, 6:04pm EST
  workflow_dispatch:
    inputs:
      mode:
        description: "preview (before the close, records nothing) or final (after it); auto picks by New York time"
        type: choice
        options: [auto, preview, final]
        default: auto
      rescan:
        description: "Final run: run a full re-scan first"
        type: boolean
        default: false
      learn:
        description: "Final run: re-fit the engine"
        type: boolean
        default: false
  # report or site changes pushed by hand only redeploy the site (the bot's own pushes don't trigger runs)
  push:
    branches: [main]
    paths:
      - "reports/**"
      - "scripts/build_site.py"

permissions:
  contents: write
  issues: write

concurrency:
  # page-only redeploys get their own group: GitHub keeps one pending run per group, so a push could
  # otherwise cancel a scheduled monitor run waiting behind it
  group: breakout-monitor-${{ github.event_name == 'push' && 'pages' || 'run' }}
  cancel-in-progress: false

jobs:
  run:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      mode: ${{ steps.when.outputs.mode }}
    env:
      MONITOR_BRANCH: main
      GH_TOKEN: ${{ github.token }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      SITE: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Pick the run (preview, final or skip) from New York time
        id: when
        run: |
          now=$(TZ=America/New_York date +%H%M); dow=$(TZ=America/New_York date +%u)
          mode=skip
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            mode="${{ inputs.mode }}"
            if [ "$mode" = auto ]; then
              if [ "$dow" -le 5 ] && [ "$now" -ge 930 ] && [ "$now" -lt 1600 ]; then mode=preview; else mode=final; fi
            fi
          elif [ "$now" -ge 1500 ] && [ "$now" -lt 1558 ]; then
            mode=preview
          elif [ "$now" -ge 1745 ] && [ "$now" -lt 1855 ]; then
            mode=final
          fi
          echo "New York time $now: $mode"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.when.outputs.mode != 'skip'
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        if: steps.when.outputs.mode != 'skip'
        with:
          python-version: "3.11"
          cache: pip

      - name: Configure git
        if: steps.when.outputs.mode != 'skip'
        run: |
          git config user.name "breakout-monitor[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Pre-close preview (records nothing; commits only reports/preview.*)
        if: steps.when.outputs.mode == 'preview'
        run: |
          bash scripts/cloud_run.sh --preview | tee run_output.txt
          if grep -q "PUSH FAILED" run_output.txt; then exit 1; fi

      - name: Run the monitor, commit and push its state
        if: steps.when.outputs.mode == 'final'
        run: |
          args=()
          [ "${{ inputs.rescan }}" = "true" ] && args+=(--rescan)
          [ "${{ inputs.learn }}" = "true" ] && args+=(--learn)
          bash scripts/cloud_run.sh "${args[@]}" | tee run_output.txt
          if grep -q "PUSH FAILED" run_output.txt; then exit 1; fi

      - name: Post the summary
        if: steps.when.outputs.mode != 'skip'
        run: |
          if [ "${{ steps.when.outputs.mode }}" = preview ]; then
            grep -v '^NOTIFY:' reports/preview.md > body.md
            notify=$(grep -q '^NOTIFY: yes' reports/preview.md && echo yes || echo no)
            links="[Pre-close]($SITE/preview.html) · [Dashboard]($SITE/) · [Run log]($RUN_URL)"
          else
            grep -v '^DASHBOARD:' reports/summary.md > body.md
            # no new market data (weekend, holiday, rerun): stay quiet
            notify=$(grep -q "No new session since the last run" body.md && echo no || echo yes)
            links="[Dashboard]($SITE/) · [Pre-close]($SITE/preview.html) · [Full scan]($SITE/scan.html) · [Run log]($RUN_URL)"
          fi
          cat body.md >> "$GITHUB_STEP_SUMMARY"
          if [ "$notify" = no ] && [ "${{ github.event_name }}" = "schedule" ]; then
            exit 0
          fi
          issue=$(gh issue list --label breakout-monitor --state open --json number --jq '.[0].number // empty')
          if [ -z "$issue" ]; then
            gh label create breakout-monitor --color 2a78d6 --description "Daily breakout monitor summaries" 2>/dev/null || true
            url=$(gh issue create --title "Breakout monitor: daily summaries" --label breakout-monitor \
                  --assignee "${{ github.repository_owner }}" \
                  --body "Each weekday the breakout monitor posts here: a pre-close preview when names are on track to trigger, and the summary after the close.")
            issue=${url##*/}
            gh issue pin "$issue" || true
          fi
          { cat body.md; echo; echo "$links"; } > comment.md
          gh issue comment "$issue" --body-file comment.md

      - name: Report a failure
        if: failure()
        run: |
          msg="The breakout monitor run failed: $RUN_URL"
          issue=$(gh issue list --label breakout-monitor --state open --json number --jq '.[0].number // empty')
          if [ -n "$issue" ]; then
            gh issue comment "$issue" --body "$msg"
          else
            gh issue create --title "Breakout monitor run failed" --assignee "${{ github.repository_owner }}" --body "$msg"
          fi

  # Publishes the pages the run just committed. Needs Settings → Pages → Source: "GitHub Actions".
  # Kept as its own job so a Pages problem never fails the monitor run or its summary.
  pages:
    needs: run
    if: always() && (needs.run.result == 'success' || needs.run.result == 'skipped') && needs.run.outputs.mode != 'skip'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:  # one deploy at a time, in order, whichever run started it
      group: pages-deploy
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Build the site
        run: python3 scripts/build_site.py

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
